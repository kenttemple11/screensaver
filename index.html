<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>Ambient — personal screensaver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="orientation-gate" class="orientation-gate" role="alert" aria-live="assertive">
    <div class="orientation-gate-icon" aria-hidden="true">↔</div>
    <h1>Landscape mode required</h1>
    <p>Rotate your device sideways to use the screensaver.</p>
  </div>
  <div class="topography" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main class="app-shell">
    <nav class="topbar">
      <span></span>
      <div class="top-actions">
        <button id="settings-button" class="round-button" type="button" aria-label="Open widget settings">☷</button>
        <button id="fullscreen" class="round-button" type="button" aria-label="Toggle full screen">⛶</button>
      </div>
    </nav>

    <section class="stage media-stage" aria-label="Spotify media player">
      <article class="media-widget media-player" data-widget="media">
        <div class="media-cover-wrap">
          <div class="album-art" aria-label="Album artwork"></div>
        </div>
        <div class="media-details">
          <div class="track-info">
            <strong id="track-title">Midnight City</strong>
            <span id="track-artist">M83 · Hurry Up, We're Dreaming</span>
          </div>
          <div class="progress" aria-label="Track progress"><span id="progress-bar"></span></div>
          <div class="track-time"><span id="elapsed">2:18</span><span>4:03</span></div>
          <div class="media-controls">
            <button id="previous-track" type="button" aria-label="Previous track"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 24 27 10v28L8 24Zm18 0 14-14v28L26 24Z"/></svg></button>
            <button id="play-track" class="play-button" type="button" aria-label="Play"><svg class="play-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="m17 9 23 15-23 15V9Z"/></svg><svg class="pause-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M11 8h10v32H11V8Zm16 0h10v32H27V8Z"/></svg></button>
            <button id="next-track" type="button" aria-label="Next track"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m40 24-19 14V10l19 14ZM22 24 8 38V10l14 14Z"/></svg></button>
          </div>
        </div>
      </article>
    </section>

  </main>

  <dialog id="weather-dialog" class="weather-dialog">
    <div class="weather-dialog-header"><div><span class="widget-kicker">WEATHER DETAILS</span><h2 id="weather-dialog-title">Frederick, MD</h2></div><button id="close-weather" class="round-button" type="button" aria-label="Close weather details">×</button></div>
    <div class="forecast-heading"><span class="widget-kicker">5 DAY FORECAST</span><span id="weather-updated">—</span></div>
    <div id="forecast-list" class="forecast-list"></div>
    <div id="weather-facts" class="weather-facts"></div>
  </dialog>
  <aside id="settings-panel" class="settings-panel" aria-label="Widget settings" aria-hidden="true">
    <div class="settings-header"><div><span class="widget-kicker">PERSONALIZE</span><h2>Screen setup</h2></div><button id="close-settings" class="round-button" type="button" aria-label="Close settings">×</button></div>
    <div class="toggle-list">
      <label><span><strong>Local weather</strong><small>Conditions and temperature</small></span><input type="checkbox" data-toggle="weather" checked><i></i></label>
      <label><span><strong>Spotify controls</strong><small>Currently playing and transport</small></span><input type="checkbox" data-toggle="media" checked><i></i></label>
    </div>
    <form id="api-settings" class="api-settings">
      <span class="widget-kicker">API CONNECTIONS</span>
      <label for="openweather-key">OpenWeatherMap key</label>
      <input id="openweather-key" type="password" autocomplete="off" placeholder="Paste public API key">
      <label for="spotify-client-id">Spotify client ID</label>
      <input id="spotify-client-id" type="text" autocomplete="off" placeholder="Paste client ID">
      <label for="spotify-redirect-uri">Spotify redirect URI</label>
      <input id="spotify-redirect-uri" type="url" autocomplete="url" placeholder="http://localhost:3000/callback">
      <p class="api-note">Saved only in this browser. Never enter a Spotify client secret here.</p>
      <div class="api-actions"><button id="spotify-connect" class="secondary-button" type="button">CONNECT SPOTIFY</button><button id="clear-api-settings" class="secondary-button" type="button">CLEAR</button><button class="primary-button" type="submit">SAVE KEYS</button></div>
    </form>
  </aside>
  <div id="settings-backdrop" class="settings-backdrop" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
